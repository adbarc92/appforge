# DevTeam.AI Design Ledger Schema v1.0
version: 1.0
description: >
  Canonical schema for recording immutable design decisions, trade-offs,
  and approvals across every phase. Each entry is append-only and may
  reference earlier records via overrides or related_decisions.

fields:
  decision_id:
    type: string
    format: "adr_### or custom slug"
    required: true
    notes: "Must be unique, lowercase, no spaces."

  phase:
    type: integer
    range: [0, 14]
    required: true
    notes: "Phase number in roadmap when decision became effective."

  timestamp:
    type: string
    format: ISO8601
    required: true
    notes: "UTC time when decision was ratified."

  agent:
    type: string
    enum:
      - clarifying_pm
      - product_owner
      - solution_architect
      - tech_lead
      - frontend
      - backend
      - database
      - ai_ml
      - devops
      - security
      - uiux_designer
      - qa
      - technical_writer
      - orchestrator
      - budgetguard
      - delivery_summarizer
      - context_curator
    required: true
    notes: "Authoritative agent of record."

  category:
    type: string
    enum:
      - architecture
      - tech_stack
      - design
      - security
      - performance
      - budget
      - process
    required: true

  decision:
    type: string
    required: true
    notes: "Single sentence describing outcome."

  rationale:
    type: string
    required: true
    notes: "1-3 paragraphs summarizing driving context and constraints."

  consequences:
    type: object
    required: true
    properties:
      positive:
        type: array
        items: string
        min_items: 1
      negative:
        type: array
        items: string
        min_items: 1

  alternatives_considered:
    type: array
    items:
      type: object
      properties:
        option: { type: string }
        rejected_because: { type: string }
    required: true
    notes: "At least one alternative required."

  constraints_affected:
    type: array
    items: string
    required: true
    notes: "Link to identifiers in Core Design Document (e.g., backend_db_choice)."

  overrides:
    type: array
    items: string
    required: false
    notes: "Decision IDs superseded by this entry."

  referenced_by:
    type: array
    items: string
    required: false
    notes: "Artifacts or tasks that cite this decision."

validation_rules:
  - rule: "decision_id must match ^[a-z0-9_-]+$"
    action: "reject entry if invalid"
  - rule: "phase must be >= recorded phase in overrides"
    action: "prevent earlier phase from overriding later work"
  - rule: "at least one positive and one negative consequence"
    action: "force explicit trade-off acknowledgement"
  - rule: "timestamp must be monotonic per decision_id lineage"
    action: "reject out-of-order edits"

retention:
  storage: "docs/design-ledger/"
  format: "one YAML file per phase plus aggregated index"
  immutability: "entries append-only; corrections require superseding record"

examples:
  - decision_id: arch_004
    phase: 4
    timestamp: "2025-12-07T10:42:11Z"
    agent: solution_architect
    category: architecture
    decision: "Adopt Fastify for backend instead of Express."
    rationale: >
      Benchmarking showed 1.9x throughput improvement under projected load,
      while keeping TypeScript support and minimal migration cost.
    consequences:
      positive:
        - "Lower P95 latency for course APIs."
        - "Shared validation schemas with frontend via TypeBox."
      negative:
        - "Smaller hiring pool familiar with Fastify."
        - "Need to port existing Express middleware."
    alternatives_considered:
      - option: "Express"
        rejected_because: "Baseline throughput insufficient for 1k concurrent users."
      - option: "NestJS"
        rejected_because: "Adds framework overhead not justified for MVP."
    constraints_affected:
      - backend_framework_choice
      - middleware_strategy
    overrides:
      - arch_002
    referenced_by:
      - backend_agent_task_005
      - qa_suite_api_smoke
